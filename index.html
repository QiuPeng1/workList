<!DOCTYPE html>
<!-- 个人办公工作台 · 单文件 HTML，全部资源内联，断网可用 · 数据存 localStorage -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>个人办公工作台</title>
<style>
:root{
  --bg:#f5f7f9;
  --card:#ffffff;
  --ink:#0f172a;
  --ink2:#475569;
  --ink3:#94a3b8;
  --line:#e4e9ee;
  --line2:#eef2f5;
  --teal:#0d9488;
  --teal-d:#0f766e;
  --teal-l:#14b8a6;
  --cyan:#0891b2;
  --teal-50:#f0fdfa;
  --teal-50b:#ccfbf1;
  --red:#dc2626;
  --red-d:#b91c1c;
  --red-bg:#fef2f2;
  --orange:#ea8a17;
  --orange-bg:#fff8ec;
  --green:#16a34a;
  --green-bg:#f0fdf4;
  --gray:#64748b;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --shadow2:0 6px 20px rgba(15,23,42,.08);
  --r:14px;
  --r-sm:10px;
  --r-xs:7px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
::placeholder{color:var(--ink3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* ===== 页头 ===== */
.header{
  position:relative;overflow:hidden;
  background:linear-gradient(120deg,#0f766e 0%,#0d9488 45%,#0891b2 100%);
  color:#fff;
}
.header-inner{
  max-width:1200px;margin:0 auto;padding:20px 24px 22px;
  display:flex;align-items:center;gap:16px;position:relative;z-index:2;
}
.header svg.bg{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:.9}
.header .logo{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:rgba(255,255,255,.16);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.25);
}
.header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px}
.header .sub{margin:2px 0 0;font-size:12.5px;opacity:.85}
.header .stat{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.header .stat .chip{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;white-space:nowrap;
}
.header .stat .chip b{font-weight:800;margin-left:3px}

/* ===== 布局 ===== */
.app{display:flex;max-width:1200px;margin:0 auto;min-height:calc(100vh - 90px)}
.sidebar{
  width:232px;flex-shrink:0;padding:18px 14px 90px;
  position:sticky;top:0;align-self:flex-start;height:fit-content;
}
.nav-group{margin-bottom:8px}
.nav-group .label{font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:1px;padding:0 10px 6px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:11px 12px;border-radius:10px;color:var(--ink2);
  font-size:14.5px;font-weight:600;transition:.15s;text-align:left;
}
.nav-item:hover{background:var(--teal-50);color:var(--teal-d)}
.nav-item.active{background:linear-gradient(90deg,var(--teal),var(--cyan));color:#fff;box-shadow:0 4px 12px rgba(13,148,136,.3)}
.nav-item svg{flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.nav-item.active .badge{background:rgba(255,255,255,.3)}
.nav-item .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--orange)}
.nav-item.active .dot{background:#fff}

.main{flex:1;min-width:0;padding:18px 22px 90px}
.main h2.sec{margin:0 0 14px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:9px}
.main h2.sec .desc{font-size:12.5px;font-weight:500;color:var(--ink3)}

/* ===== 卡片 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:16px 18px}

/* ===== 今天要处理 预警区 ===== */
.alert-wrap{padding:16px 22px 0;max-width:1200px;margin:0 auto}
.alert{background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.alert.empty{border-left-color:var(--green)}
.alert-head{display:flex;align-items:center;gap:10px;padding:13px 18px;background:var(--red-bg);color:var(--red-d);font-weight:700;font-size:14px}
.alert.empty .alert-head{background:var(--green-bg);color:#15803d}
.alert-body{padding:6px 18px 14px}
.alert-section{padding:8px 0}
.alert-section + .alert-section{border-top:1px dashed var(--line)}
.alert-section .at{font-size:12.5px;color:var(--ink3);font-weight:700;margin:4px 0 6px;display:flex;align-items:center;gap:6px}
.alert-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;background:#fffaf9;border:1px solid #fde3e0;margin-bottom:6px}
.alert-item .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--red);color:#fff}
.alert-item .ttl{flex:1;font-size:14px;font-weight:600;color:var(--ink)}
.alert-item .meta{font-size:12px;color:var(--red-d);font-weight:600}
.alert-item button{padding:7px 12px;border-radius:7px;background:var(--red);color:#fff;font-size:12.5px;font-weight:700;min-height:34px}
.alert-item button.ghost{background:#fff;color:var(--red-d);border:1px solid #f3c9c4}
.alert-item.project{background:#fff7ed;border-color:#fed7aa}
.alert-item.project .tag{background:var(--orange)}
.alert-item.project button{background:var(--orange)}
.alert-item.project .meta{color:#c2670a}

/* ===== 输入区 ===== */
.form-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.input,.select{
  border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;
  font-size:16px;transition:.15s;outline:none;width:100%;min-height:44px;
}
.input:focus,.select:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-50b)}
textarea.input{resize:vertical;min-height:72px;line-height:1.55;padding:11px 12px}
.btn{
  min-height:44px;padding:10px 16px;border-radius:9px;font-weight:700;font-size:14.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s;white-space:nowrap;
}
.btn-primary{background:linear-gradient(90deg,var(--teal),var(--teal-l));color:#fff;box-shadow:0 3px 10px rgba(13,148,136,.28)}
.btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal-d);background:var(--teal-50)}
.btn-danger{background:#fff;border:1.5px solid #f3c9c4;color:var(--red-d)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{min-height:34px;padding:6px 11px;font-size:12.5px;border-radius:7px}

.field-label{font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:5px;display:block;letter-spacing:.3px}

/* ===== 待办列表 ===== */
.task-group{margin-bottom:18px}
.task-group .gt{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:9px;letter-spacing:.3px}
.task-group .gt .cnt{font-size:12px;font-weight:700;color:var(--ink3);background:var(--bg);padding:2px 9px;border-radius:999px}
.task-group.overdue .gt{color:var(--red)}
.task-group.today .gt{color:var(--teal-d)}
.task-item{
  display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:10px;
  background:#fff;border:1px solid var(--line);margin-bottom:8px;transition:.15s;
}
.task-item:hover{border-color:#cde8e3;box-shadow:var(--shadow)}
.task-item.overdue{border-color:#f3c9c4;background:#fffafa}
.task-item.done{opacity:.62;background:#fafbfc}
.task-item.done .ttl{text-decoration:line-through;color:var(--ink3)}
.check{
  width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:.15s;background:#fff;
}
.check:hover{border-color:var(--teal)}
.task-item.done .check{background:var(--green);border-color:var(--green)}
.check svg{opacity:0;transition:.15s}
.task-item.done .check svg{opacity:1}
.task-body{flex:1;min-width:0}
.task-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.task-top .ttl{font-size:15px;font-weight:600;color:var(--ink)}
.pri{font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.3px}
.pri-urgent{background:#fee2e2;color:#b91c1c}
.pri-high{background:#fef3c7;color:#b45309}
.pri-mid{background:#cffafe;color:#0e7490}
.pri-low{background:#f1f5f9;color:#64748b}
.postp{font-size:11px;font-weight:700;color:var(--red-d);background:#fee2e2;padding:2px 7px;border-radius:5px}
.proj-tag{font-size:11px;font-weight:700;color:var(--teal-d);background:var(--teal-50);border:1px solid var(--teal-50b);padding:2px 8px;border-radius:5px;display:inline-flex;align-items:center;gap:4px}
.due{font-size:12px;color:var(--ink3);font-weight:600}
.due.red{color:var(--red)}
.task-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.icon-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink3);transition:.15s}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn.del:hover{background:var(--red-bg);color:var(--red)}
.empty-state{text-align:center;padding:34px 16px;color:var(--ink3)}
.empty-state svg{margin-bottom:8px;opacity:.6}

/* 日期分组标记 */
.group-stripe{width:4px;height:18px;border-radius:3px;background:var(--teal)}
.task-group.overdue .group-stripe{background:var(--red)}
.task-group.tomorrow .group-stripe{background:var(--orange)}
.task-group.later .group-stripe{background:var(--cyan)}
.task-group.done .group-stripe{background:var(--ink3)}

/* ===== 灵感速记 ===== */
.idea-tags-filter{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
.tag-chip{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);color:var(--ink2);transition:.15s}
.tag-chip:hover{border-color:var(--teal);color:var(--teal-d)}
.tag-chip.active{background:var(--teal-d);color:#fff;border-color:var(--teal-d)}
.idea-item{padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:#fff;transition:.15s}
.idea-item:hover{box-shadow:var(--shadow);border-color:#d6ecea}
.idea-item .content{font-size:14.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.idea-item .foot{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.idea-item .it-tag{font-size:11px;font-weight:700;color:var(--teal-d);background:var(--teal-50);padding:2px 8px;border-radius:5px}
.idea-item .time{font-size:11.5px;color:var(--ink3);margin-left:auto}

/* ===== 项目 ===== */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.proj-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:.15s;position:relative;overflow:hidden}
.proj-card:hover{box-shadow:var(--shadow2);border-color:#cde8e3}
.proj-card.stuck{border-color:#fcd34d;background:linear-gradient(180deg,#fffbeb 0%,#fff 60px)}
.proj-card .ph{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.proj-color{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.proj-card h3{margin:0;font-size:15.5px;font-weight:700;flex:1}
.proj-card .stuck-flag{font-size:10.5px;font-weight:800;color:#c2670a;background:#fef3c7;padding:2px 7px;border-radius:5px;letter-spacing:.3px}
.proj-field{margin:7px 0;font-size:13px;line-height:1.55}
.proj-field .k{font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:.5px;display:block;margin-bottom:1px}
.proj-field .v{color:var(--ink)}
.proj-field.blocker .v{color:var(--red-d);font-weight:600}
.proj-prog{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.proj-prog .pr-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.prog-bar{height:8px;background:var(--bg);border-radius:5px;overflow:hidden}
.prog-bar .fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-l));border-radius:5px;transition:.4s}
.proj-prog .sub-tasks{margin-top:9px}
.proj-prog .st{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 0}
.proj-prog .st .mini-check{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.proj-prog .st.done .mini-check{background:var(--green);border-color:var(--green)}
.proj-prog .st.done .st-t{text-decoration:line-through;color:var(--ink3)}
.proj-prog .st .st-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== 复盘 ===== */
.review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:18px}
.metric{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:center;box-shadow:var(--shadow)}
.metric .num{font-size:34px;font-weight:800;color:var(--teal-d);line-height:1}
.metric .lab{font-size:12.5px;color:var(--ink3);font-weight:600;margin-top:7px}
.metric .sub{font-size:11.5px;color:var(--ink3);margin-top:3px}
.chart-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.chart-card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:11px;font-size:12px;color:var(--ink2)}
.legend .li{display:flex;align-items:center;gap:5px}
.legend .sw{width:11px;height:11px;border-radius:3px}
.bar-list .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.bar-list .bar-row .bn{width:90px;flex-shrink:0;font-weight:600;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-list .bar-track{flex:1;height:24px;background:var(--bg);border-radius:6px;overflow:hidden;position:relative}
.bar-list .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11.5px;font-weight:800;transition:.5s}
.blocker-list .bi{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;margin-bottom:8px}
.blocker-list .bi .bp{font-weight:700;color:#92400e;font-size:13px;flex:1}
.blocker-list .bi .bk{font-size:11px;color:var(--ink3);display:block;margin-bottom:2px;font-weight:700;letter-spacing:.3px}

/* ===== 工具栏 ===== */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .spacer{flex:1}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:var(--shadow2);opacity:0;transition:.3s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.backup-tip{background:linear-gradient(90deg,#fffbeb,#fff8e1);border:1px solid #fde68a;border-radius:10px;padding:11px 15px;display:flex;align-items:center;gap:11px;margin-bottom:16px;font-size:13.5px;color:#92400e;font-weight:600}
.backup-tip button{margin-left:auto;min-height:36px;padding:7px 14px;border-radius:8px;background:#92400e;color:#fff;font-weight:700;font-size:12.5px}

/* 模态确认 */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:300;opacity:0;pointer-events:none;transition:.2s}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:380px;width:90%;box-shadow:var(--shadow2);transform:scale(.92);transition:.2s}
.modal-mask.show .modal{transform:scale(1)}
.modal h3{margin:0 0 8px;font-size:17px}
.modal p{margin:0 0 18px;font-size:14px;color:var(--ink2);line-height:1.6}
.modal .acts{display:flex;gap:9px;justify-content:flex-end}
.modal .acts .btn{min-height:42px}
.task-item{cursor:pointer}
.task-group .gt{cursor:pointer;user-select:none}
.task-group .gt:hover{color:#0d9488}
.gt-toggle{display:inline-block;margin-left:4px;color:var(--ink3);font-size:11px;transition:transform .15s}
.task-group.collapsed .gt-toggle{transform:rotate(-90deg)}
.modal .acts .btn-danger{margin-right:auto}
.edit-field{display:flex;flex-direction:column;gap:9px;margin-bottom:10px}

/* ===== 云同步 ===== */
.sync-card h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.sync-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--ink3)}
.sync-status.syncing{background:#e0f2fe;color:#0369a1}
.sync-status.synced{background:var(--green-bg);color:#15803d}
.sync-status.offline{background:var(--orange-bg);color:#c2670a}
.sync-status.error{background:var(--red-bg);color:var(--red-d)}
.sync-info{font-size:12.5px;color:var(--ink3);line-height:1.65;margin:8px 0}
.sync-info b{color:var(--ink2)}
.sync-step{font-size:12.5px;color:var(--ink2);line-height:1.75;background:var(--bg);border-radius:8px;padding:11px 13px;margin:8px 0}
.sync-step b{color:var(--ink)}
.sync-step .num{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--teal-d);color:#fff;font-size:11px;text-align:center;line-height:18px;margin-right:5px;font-weight:800}
#syncIndicator{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:11.5px}

/* ===== 移动端 ===== */
.mobile-nav{display:none}
@media(max-width:820px){
  .header-inner{padding:16px 16px 18px;flex-wrap:wrap}
  .header h1{font-size:18px}
  .header .stat{margin-left:0;width:100%;margin-top:6px}
  .alert-wrap{padding:14px 14px 0}
  .app{flex-direction:column;max-width:100%}
  .sidebar{display:none}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100;
    background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 12px rgba(15,23,42,.06);
  }
  .mobile-nav .mn-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;
    color:var(--ink3);font-size:10.5px;font-weight:600;border-radius:9px;transition:.15s;min-height:50px;justify-content:center;
  }
  .mobile-nav .mn-item.active{color:var(--teal-d)}
  .mobile-nav .mn-item .mn-badge{position:absolute;top:3px;right:50%;transform:translateX(18px);background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;padding:0 4px;display:flex;align-items:center;justify-content:center}
  .main{padding:14px 14px 90px}
  .toolbar .btn{flex:1;min-width:0}

<script>
/* ============================================================
   个人办公工作台 · 数据层
============================================================ */
const LS_KEY='wb_office_workbench_v1';
let DB={tasks:[],ideas:[],projects:[],meta:{backupPromptedCount:0}};
let curTab='todo';
let ideaFilterTags=[]; // 选中的标签筛选
let confirmCb=null;

/* ---------- 工具 ---------- */
const $=s=>document.querySelector(s);
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dateStr=off=>{const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const tomorrowStr=()=>dateStr(1);
const fmtDate=s=>{if(!s)return'';const[m,y,d]=s.match(/(\d+)-(\d+)-(\d+)/).slice(1);return `${y}月${d}日`;};
const fmtDateShort=s=>{if(!s)return'';const a=s.split('-');return `${parseInt(a[1])}/${parseInt(a[2])}`;};
const relDate=s=>{if(!s)return'';const t=todayStr();if(s===t)return'今天';if(s===tomorrowStr())return'明天';if(s<t)return'已逾期';const tt=new Date(t),ss=new Date(s);const diff=Math.round((ss-tt)/86400000);if(diff<=6)return`${diff}天后`;return fmtDate(s);};
const fmtTime=ts=>{const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const startOfWeek=d=>{const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;};
const endOfWeek=d=>{const x=startOfWeek(d);x.setDate(x.getDate()+6);x.setHours(23,59,59,999);return x;};

const PRI={urgent:{label:'紧急',cls:'pri-urgent',color:'#dc2626'},high:{label:'高',cls:'pri-high',color:'#ea8a17'},mid:{label:'中',cls:'pri-mid',color:'#0891b2'},low:{label:'低',cls:'pri-low',color:'#64748b'}};
const PROJ_COLORS=['#0d9488','#0891b2','#7c3aed','#db2777','#ea8a17','#16a34a','#2563eb'];

/* ---------- 持久化 ---------- */
function save(){
  DB.meta.lastModified=DB.meta.lastModified||Date.now();
  localStorage.setItem(LS_KEY,JSON.stringify(DB));
  checkBackupTip();
  scheduleSyncUpload();
}
function load(){try{const r=localStorage.getItem(LS_KEY);if(r){DB=JSON.parse(r);if(!DB.meta)DB.meta={};if(!DB.tasks)DB.tasks=[];if(!DB.ideas)DB.ideas=[];if(!DB.projects)DB.projects=[];if(!DB.meta.sync||DB.meta.sync.serverDomain!==undefined)DB.meta.sync={apiKey:'',binId:'',autoSync:false,lastSyncAt:0};return true;}}catch(e){}return false;}

/* ---------- 启动顺延：昨天的未完成 → 今天 ---------- */
function autoPostpone(){
  const t=todayStr();let changed=false;
  DB.tasks.forEach(x=>{
    if(!x.done&&x.dueDate&&x.dueDate<t){
      x.dueDate=t;x.postponedCount=(x.postponedCount||0)+1;changed=true;
    }
  });
  if(changed)save();
}

/* ---------- 示例数据 ---------- */

    {id:pMig,name:'SLM757→SLM550D 迁移',currentStep:'原理图适配已完成',nextStep:'打板验证与驱动联调',blocker:'',color:PROJ_COLORS[1],createdAt:Date.now()-6*86400000,updatedAt:Date.now()-86400000,_ex:true},
    {id:pDoc,name:'宝坚维修记录归档',currentStep:'东鹏 3-6 月记录整理中',nextStep:'按客户拆分多 Sheet 汇总',blocker:'中国百事数据未补齐',color:PROJ_COLORS[2],createdAt:Date.now()-9*86400000,updatedAt:Date.now()-2*86400000,_ex:true},
  ];
  DB.tasks=[
    {id:uid(),title:'整理 BK 系列本周 PR/Issue 清单',priority:'urgent',dueDate:t,done:false,projectId:pBk,postponedCount:1,createdAt:Date.now()-86400000,completedAt:null,_ex:true},
    {id:uid(),title:'回复东鹏维修进度邮件',priority:'high',dueDate:t,done:false,projectId:pDoc,postponedCount:0,createdAt:Date.now()-3600000,completedAt:null,_ex:true},
    {id:uid(),title:'对比 757Q 与 R818 电源域设计',priority:'mid',dueDate:tom,done:false,projectId:pMig,postponedCount:0,createdAt:Date.now()-7200000,completedAt:null,_ex:true},
    {id:uid(),title:'写本周研发周报',priority:'high',dueDate:dp1,done:false,projectId:null,postponedCount:0,createdAt:Date.now()-5400000,completedAt:null,_ex:true},
    {id:uid(),title:'归档宝坚产品规格书(3份)',priority:'low',dueDate:dp2,done:false,projectId:pDoc,postponedCount:0,createdAt:Date.now()-9000000,completedAt:null,_ex:true},
    {id:uid(),title:'梳理 DevConnect 宣传物料排期',priority:'mid',dueDate:y,done:true,projectId:null,postponedCount:0,createdAt:Date.now()-2*86400000,completedAt:Date.now()-86400000,_ex:true},
  ];
  DB.ideas=[
    {id:uid(),content:'周报可以用「本周完成 / 卡点 / 下周计划」三段式模板，配合项目进度条一目了然。',tags:['周报','效率'],createdAt:Date.now()-2*86400000,_ex:true},
    {id:uid(),content:'模组迁移方案对比，建议用表格列：主控/外挂模组/电源/接口/成本，比纯文字汇报更直观。',tags:['迁移','汇报'],createdAt:Date.now()-86400000,_ex:true},
    {id:uid(),content:'维修记录按「客户×故障类型」双维度建二维表，月底统计高频故障更省事。',tags:['维修记录','统计'],createdAt:Date.now()-43200000,_ex:true},
  ];
  DB.meta=DB.meta||{};DB.meta.backupPromptedCount=0;
  save();
}

/* ---------- 初始化 ---------- */
function init(){
  if(!load()){seedDemo();showToast('已为你预置示例数据，可点「清空示例」清掉');}
  autoPostpone();
  renderSidebar();renderMobileNav();renderAll();
  var c=syncConfig();
  if(c.autoSync&&c.binId){
    setSyncStatus('syncing');
    syncDownload(true).then(function(ok){if(ok){renderAll();}});
  }else{
    setSyncStatus('idle');
  }
}

/* ============================================================
   渲染：页头统计 + 导航
============================================================ */
function renderHead(){
  const t=todayStr();
  const todayTodo=DB.tasks.filter(x=>!x.done&&x.dueDate===t).length;
  const stuck=DB.projects.filter(p=>p.blocker&&p.blocker.trim()).length;
  const weekDone=DB.tasks.filter(x=>x.done&&x.completedAt&&x.completedAt>=startOfWeek(new Date()).getTime()).length;
  const el=$('#headStat');
  el.innerHTML=`
    <span class="chip" id="syncIndicator" title="云同步状态">本地</span>
    <span class="chip">今日待办<b>${todayTodo}</b></span>
    <span class="chip">本周完成<b>${weekDone}</b></span>
    <span class="chip">卡点项目<b>${stuck}</b></span>`;
  setSyncStatus(syncState);
}

function renderSidebar(){
  const t=todayStr();
  const todayTodo=DB.tasks.filter(x=>!x.done&&x.dueDate===t).length;
  const stuck=DB.projects.filter(p=>p.blocker&&p.blocker.trim()).length;
  const ideas=DB.ideas.length;
  const nav=[
    {key:'todo',label:'今天待办',icon:'<path d="M4 6h16M4 12h10M4 18h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="19" cy="12" r="2.4" stroke="currentColor" stroke-width="2" fill="none"/>',badge:todayTodo},
    {key:'idea',label:'灵感速记',icon:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.7 10.7c.5.4.7 1 .7 1.6V16h6v-.7c0-.6.2-1.2.7-1.6A6 6 0 0012 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/>'},
    {key:'project',label:'项目跟进',icon:'<rect x="3" y="5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="14" y="5" width="7" height="4" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="14" y="12" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="3" y="15" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/>',dot:stuck>0},
    {key:'review',label:'每周复盘',icon:'<path d="M4 15l4-5 3 3 4-6 5 8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none" stroke-linecap="round"/>',},
  ];
  $('#sidebar').innerHTML=`
    <div class="nav-group">
      <div class="label">工作台</div>
      ${nav.map(n=>`<button class="nav-item ${curTab===n.key?'active':''}" data-tab="${n.key}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">${n.icon}</svg>
        ${n.label}
        ${n.badge?`<span class="badge">${n.badge}</span>`:''}
        ${n.dot?`<span class="dot"></span>`:''}
      </button>`).join('')}
    </div>
    <div class="nav-group" style="margin-top:14px">
      <div class="label">数据</div>
      <button class="nav-item" id="navSync"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 16a4 4 0 010-8 5 5 0 019.6-1.5A4.5 4.5 0 1117 16H6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>云同步${syncConfig().autoSync?'<span class="dot" style="background:var(--green)"></span>':''}</button>
      <button class="nav-item" id="navExport"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>导出备份</button>
      <button class="nav-item" id="navImport"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 15V3m0 0L8 7m4-4l4 4M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>导入恢复</button>
      <button class="nav-item" id="navClearDemo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>清空示例</button>
      <button class="nav-item" id="navClearAll" style="color:var(--red-d)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.3 3.9L2.4 17.5A2 2 0 004.1 20.5h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>清空全部</button>
    </div>`;
  $('#sidebar').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

/* ============================================================
   渲染：今天要处理 预警区
============================================================ */
function renderAlert(){
  const t=todayStr();
  const overdue=DB.tasks.filter(x=>!x.done&&x.dueDate&&x.dueDate<=t&&(x.postponedCount>0||x.dueDate<t));
  const stuck=DB.projects.filter(p=>p.blocker&&p.blocker.trim());
  const box=$('#alertBox');
  if(overdue.length===0&&stuck.length===0){
    box.classList.add('empty');
    box.innerHTML=`<div class="alert-head"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>今天没有逾期项，节奏不错，继续加油</div>`;
    return;
  }
  box.classList.remove('empty');
  let h=`<div class="alert-head"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.3 3.9L2.4 17.5A2 2 0 004.1 20.5h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>今天要处理 · 共 ${overdue.length+stuck.length} 项需关注</div><div class="alert-body">`;
  if(overdue.length){
    h+=`<div class="alert-section"><div class="at"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>顺延/逾期任务（${overdue.length}）</div>`;
    overdue.sort((a,b)=>priOrder(a)-priOrder(b)).forEach(x=>{
      const p=PRI[x.priority];
      h+=`<div class="alert-item">
        <span class="tag">${p.label}</span>
        <span class="ttl">${esc(x.title)}</span>
        <span class="meta">${x.postponedCount>0?('已顺延'+x.postponedCount+'次 · '):''}${relDate(x.dueDate)}</span>
        <button class="ghost" data-done="${x.id}">完成</button>
        <button data-post="${x.id}">顺延到明天</button>
      </div>`;
    });
    h+=`</div>`;
  }
  if(stuck.length){
    h+=`<div class="alert-section"><div class="at"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v6m0 4v8M3 12h6m4 0h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".4"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" fill="none"/></svg>卡住的项目（${stuck.length}）</div>`;
    stuck.forEach(p=>{
      h+=`<div class="alert-item project">
        <span class="tag">卡点</span>
        <span class="ttl">${esc(p.name)}</span>
        <span class="meta">${esc(p.blocker)}</span>

function priOrder(x){const v={urgent:0,high:1,mid:2,low:3}[x.priority];return v!=null?v:4;}
function renderTodo(){
  const t=todayStr();

  const html=`
    <h2 class="sec"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="3" stroke="#0d9488" stroke-width="1.8" fill="none"/><path d="M3 9h18M8 2v4M16 2v4" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round"/><path d="M8.5 14.5l2 2 4-4" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>今天待办<span class="desc">按日期分组，逾期标红，一键顺延</span></h2>

    <div class="card card-pad" style="margin-bottom:16px">
      <div class="form-row">
        <input class="input" id="taskTitle" placeholder="今天要处理的事… 回车快速添加" style="flex:1;min-width:160px">
        <select class="select" id="taskPri" style="width:auto;min-width:96px">
          <option value="urgent">紧急</option><option value="high" selected>高</option><option value="mid">中</option><option value="low">低</option>
        </select>
        <input class="input" id="taskDue" type="date" value="${t}" style="width:auto;min-width:140px">
        <select class="select" id="taskProj" style="width:auto;min-width:120px"><option value="">不关联项目</option>${projOpts}</select>
        <button class="btn btn-primary" id="addTask"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>添加</button>
      </div>
    </div>

    <div id="taskList"></div>
  `;
  $('#main').innerHTML=html;
  $('#addTask').onclick=addTask;
  $('#taskTitle').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});
  renderTaskList();
}
function addTask(){
  const title=$('#taskTitle').value.trim();
  if(!title){showToast('先写一下任务内容');return;}
  const priority=$('#taskPri').value;
  const dueDate=$('#taskDue').value||todayStr();
  const projectId=$('#taskProj').value||null;
  DB.tasks.unshift({id:uid(),title,priority,dueDate,done:false,projectId,postponedCount:0,createdAt:Date.now(),completedAt:null});
  save();
  $('#taskTitle').value='';$('#taskPri').value='high';$('#taskProj').value='';
  renderAll();showToast('已添加');
}
function renderTaskList(){
  const t=todayStr();
  const groups=[
    {key:'overdue',label:'逾期 / 已顺延',cls:'overdue',items:[]},
    {key:'today',label:'今天',cls:'today',items:[]},
    {key:'tomorrow',label:'明天',cls:'tomorrow',items:[]},
    {key:'week',label:'本周内',cls:'later',items:[]},
    {key:'later',label:'更远',cls:'later',items:[]},
    {key:'nodate',label:'未排期',cls:'',items:[]},
    {key:'done',label:'已完成',cls:'done',items:[]},
  ];
  const sow=startOfWeek(new Date()).getTime(),eow=endOfWeek(new Date()).getTime();
  DB.tasks.forEach(x=>{
    if(x.done){groups[6].items.push(x);return;}
    if(!x.dueDate){groups[5].items.push(x);return;}
    if(x.dueDate<t){groups[0].items.push(x);return;}
    if(x.dueDate===t){groups[1].items.push(x);return;}
    if(x.dueDate===tomorrowStr()){groups[2].items.push(x);return;}
    const dt=new Date(x.dueDate).getTime();
    if(dt>=sow&&dt<=eow){groups[3].items.push(x);return;}
    groups[4].items.push(x);
  });
  groups.forEach(g=>g.items.sort((a,b)=>priOrder(a)-priOrder(b)||a.dueDate.localeCompare(b.dueDate)));
  let h='';
  groups.forEach(g=>{
    if(!g.items.length)return;
    const collapsed=g.key==='done';
    h+=`<div class="task-group ${g.cls} ${collapsed?'collapsed':''}">
      <div class="gt" data-group="${g.key}"><span class="group-stripe"></span>${g.label}<span class="cnt">${g.items.length}</span><span class="gt-toggle">▾</span></div>
      <div class="group-body" data-body="${g.key}" ${collapsed?'style="display:none"':''}>${g.items.map(x=>taskCard(x)).join('')}</div>
    </div>`;
  });
  if(!h)h=`<div class="empty-state"><svg width="52" height="52" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="3" stroke="#cbd5e1" stroke-width="1.6"/><path d="M8 11h8M8 15h5" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round"/></svg><div>还没有任务，添加第一条吧</div></div>`;
  $('#taskList').innerHTML=h;
  bindTaskEvents();
}
function taskCard(x){
  const p=PRI[x.priority];
  const proj=x.projectId?DB.projects.find(pp=>pp.id===x.projectId):null;
  const overdue=!x.done&&x.dueDate&&x.dueDate<todayStr();
  return `<div class="task-item ${x.done?'done':''} ${overdue?'overdue':''}" data-id="${x.id}">
    <button class="check" data-check="${x.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="task-body">
      <div class="task-top">
        <span class="pri ${p.cls}">${p.label}</span>
        ${x.postponedCount>0?`<span class="postp">顺延${x.postponedCount}次</span>`:''}
        ${proj?`<span class="proj-tag"><span style="width:7px;height:7px;border-radius:2px;background:${proj.color};display:inline-block"></span>${esc(proj.name)}</span>`:''}
        <span class="due ${overdue?'red':''}">${x.dueDate?relDate(x.dueDate)+' · '+fmtDateShort(x.dueDate):'未排期'}</span>
      </div>
      <div class="ttl">${esc(x.title)}</div>
    </div>
    <div class="task-actions">
      ${!x.done&&x.dueDate?`<button class="btn btn-sm btn-ghost" data-post="${x.id}" title="顺延到明天">顺延</button>`:''}
      <button class="icon-btn del" data-del="${x.id}" title="删除"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>`;
}
function bindTaskEvents(){
  document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>toggleTask(b.dataset.check));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const x=DB.tasks.find(t=>t.id===b.dataset.del);if(x){DB.tasks=DB.tasks.filter(t=>t!==x);save();renderAll();}});
  document.querySelectorAll('#taskList [data-post]').forEach(b=>b.onclick=()=>postponeTask(b.dataset.post));
  document.querySelectorAll('#taskList .gt').forEach(g=>g.onclick=()=>{
    const body=document.querySelector('#taskList [data-body="'+g.dataset.group+'"]');
    const grp=g.closest('.task-group');
    if(!body)return;
    if(body.style.display==='none'){body.style.display='block';grp.classList.remove('collapsed');}
    else{body.style.display='none';grp.classList.add('collapsed');}
  });
  document.querySelectorAll('#taskList .task-item').forEach(el=>{
    el.onclick=function(e){ if(e.target.closest('button'))return; openTaskEditor(el.dataset.id); };
  });
}
function toggleTask(id){
  const x=DB.tasks.find(t=>t.id===id);if(!x)return;
  x.done=!x.done;x.completedAt=x.done?Date.now():null;
  save();renderAll();
}
function postponeTask(id){
  const x=DB.tasks.find(t=>t.id===id);if(!x)return;
  x.dueDate=tomorrowStr();x.postponedCount=(x.postponedCount||0)+1;
  save();renderAll();showToast('已顺延到明天');
}

function fmtDateTime(ts){if(!ts)return '—';const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
let editId=null;

  const x=DB.tasks.find(t=>t.id===id);if(!x)return;
  editId=id;
  $('#editTitle').value=x.title||'';
  $('#editPri').value=x.priority||'high';
  $('#editDue').value=x.dueDate||'';

  projSel.innerHTML='<option value="">不关联项目</option>'+DB.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');

function toggleFromEditor(){

function renderReview(){
  const sow=startOfWeek(new Date()),sowT=sow.getTime(),eowT=endOfWeek(new Date()).getTime();
  const weekDone=DB.tasks.filter(x=>x.done&&x.completedAt>=sowT&&x.completedAt<=eowT);
  const weekRange=`${sow.getMonth()+1}/${sow.getDate()} - ${new Date(eowT).getMonth()+1}/${new Date(eowT).getDate()}`;

  const projEngArr=Object.entries(projEng).sort((a,b)=>b[1]-a[1]);

  // 卡点汇总

      ${trendBar(trend,maxTrend)}

    <div class="chart-card">
      <h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#0d9488" stroke-width="1.8" fill="none"/><path d="M12 3v9l6 3" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>本周完成 · 按优先级分布</h3>
      ${weekDone.length?pieChart(priDist,weekDone.length):`<div class="empty-state" style="padding:18px">本周还没有完成项</div>`}

      <h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="13" width="4" height="7" rx="1" stroke="#0d9488" stroke-width="1.6" fill="none"/><rect x="10" y="8" width="4" height="12" rx="1" stroke="#0d9488" stroke-width="1.6" fill="none"/><rect x="17" y="5" width="4" height="15" rx="1" stroke="#0d9488" stroke-width="1.6" fill="none"/></svg>本周精力分布 · 按项目</h3>
      ${projEngArr.length?`<div class="bar-list">${projEngArr.map(([name,cnt],i)=>`<div class="bar-row"><span class="bn" title="${esc(name)}">${esc(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${cnt/maxEng*100}%;background:${PROJ_COLORS[i%PROJ_COLORS.length]}">${cnt}</div></div></div>`).join('')}</div>`:`<div class="empty-state" style="padding:18px">本周完成的任务尚未关联项目</div>`}
    </div>

      <h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.3 3.9L2.4 17.5A2 2 0 004.1 20.5h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" stroke="#ea8a17" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>卡点汇总</h3>
      ${stuckList.length?`<div class="blocker-list">${stuckList.map(p=>`<div class="bi"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="9" stroke="#c2670a" stroke-width="1.6"/><path d="M12 8v5M12 16h.01" stroke="#c2670a" stroke-width="2" stroke-linecap="round"/></svg><div><span class="bk">${esc(p.name)}</span><span class="bp">${esc(p.blocker)}</span></div></div>`).join('')}</div>`:`<div class="empty-state" style="padding:18px">没有卡点，一切顺畅</div>`}
    </div>
  `;

}
function trendBar(trend,max){
  const W=560,H=150,pad=28,bw=Math.max(8,(W-pad*2)/trend.length-10);
  const maxH=H-pad*2;
  let bars='';
  trend.forEach((d,i)=>{
    const x=pad+i*((W-pad*2)/trend.length)+5;
    const h=d.cnt/max*maxH||2;
    const y=H-pad-h;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="url(#tg)"/>`;
    if(d.cnt)bars+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="10" fill="#0f766e" font-weight="700">${d.cnt}</text>`;
    bars+=`<text x="${x+bw/2}" y="${H-pad+14}" text-anchor="middle" font-size="10" fill="#94a3b8">${d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:180px">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0891b2"/></linearGradient></defs>
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e4e9ee" stroke-width="1.5"/>
    ${bars}</svg>`;
}
function pieChart(dist,total){
  const R=70,cx=80,cy=80;
  const order=['urgent','high','mid','low'];
  const colors={urgent:'#dc2626',high:'#ea8a17',mid:'#0891b2',low:'#94a3b8'};
  let acc=0,paths='';
  order.forEach(k=>{
    const v=dist[k];if(!v)return;
    const a0=acc/total*Math.PI*2-0.5,a1=(acc+v)/total*Math.PI*2-0.5;acc+=v;
    const x0=cx+Math.cos(a0)*R,y0=cy+Math.sin(a0)*R,x1=cx+Math.cos(a1)*R,y1=cy+Math.sin(a1)*R;
    const large=a1-a0>Math.PI?1:0;
    paths+=`<path d="M${cx},${cy} L${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} Z" fill="${colors[k]}"/>`;
  });
  if(total===0)paths='';
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 160 160" width="150" height="150" style="flex-shrink:0">${paths}<circle cx="80" cy="80" r="38" fill="#fff"/><text x="80" y="76" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">${total}</text><text x="80" y="93" text-anchor="middle" font-size="10" fill="#94a3b8">完成</text></svg>
    <div class="legend" style="flex-direction:column;gap:7px;margin:0">
      ${order.map(k=>`<div class="li"><span class="sw" style="background:${colors[k]}"></span>${PRI[k].label}优先级 <b style="color:#0f172a;margin-left:3px">${dist[k]||0}</b></div>`).join('')}
    </div>
  </div>`;
}

/* ============================================================
   云同步（jsonbin.io）· 多端数据互通
   - 轻量 KV 存储，零备案、零自有域名，适合个人 Web 多端同步
   - 用法：https://jsonbin.io 注册拿 Secret Key（X-Master-Key）
           首台「新建 Bin」生成共享 Bin 并自动填好 Bin ID；
           其它设备填相同 API Key + 相同 Bin ID，即自动互相同步
   - 整库（tasks/ideas/projects）作为单个 Bin 的 JSON 直接存储
   - 离线照常使用，联网后自动补传
============================================================ */
let syncTimer=null,syncState='idle';
var JSONBIN_BASE='https://api.jsonbin.io/v3';
function syncConfig(){if(!DB.meta.sync)DB.meta.sync={apiKey:'',binId:'',autoSync:false,lastSyncAt:0};return DB.meta.sync;}
function dbForUpload(){var d=JSON.parse(JSON.stringify(DB));if(d.meta)d.meta.sync=undefined;return d;} /* 上传时剔除同步凭证，避免泄露 */
function jbHeaders(){return {'Content-Type':'application/json','X-Master-Key':syncConfig().apiKey};}
/* 把 jsonbin 返回的真实错误透传出来，并把 fetch 网络层失败映射成中文提示，方便定位同步失败根因 */
function jbErr(e){var m=e&&e.message?e.message:'网络错误';if((e&&e.name==='TypeError')||/failed to fetch|networkerror|load failed|typeerror/i.test(m))return '网络不可达：浏览器无法连接 api.jsonbin.io（该服务在境外，国内访问常被限制/超时）。建议改用国内可达的同步方案。';return m;}

function setSyncStatus(state,msg){
  syncState=state;
  var el=document.getElementById('syncIndicator');
  if(!el)return;
  var map={idle:['本地','#e2e8f0'],syncing:['同步中','#7dd3fc'],synced:['已同步','#86efac'],offline:['离线','#fcd34d'],error:['同步失败','#fca5a5']};
  var m=map[state]||map.idle;
  el.innerHTML='<span style="width:7px;height:7px;border-radius:50%;background:'+m[1]+';display:inline-block"></span> '+m[0];
  el.style.color='#fff';
  el.title=msg||({idle:'未启用云同步',syncing:'正在与云端同步',synced:'数据已同步到云端',offline:'离线模式，联网后自动同步',error:'同步失败，点击数据页查看'}[state]||'');
}

function scheduleSyncUpload(){
  var c=syncConfig();
  if(!c.autoSync||!c.binId)return;
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){syncUpload(true);},2500);
}

function syncUpload(silent){
  var c=syncConfig();
  if(!c.apiKey||!c.binId){if(!silent)showToast('请先配置 API Key 与 Bin ID');return Promise.resolve(false);}
  setSyncStatus('syncing');
  DB.meta.lastModified=DB.meta.lastModified||Date.now();
  return fetch(JSONBIN_BASE+'/b/'+encodeURIComponent(c.binId),{method:'PUT',headers:jbHeaders(),body:JSON.stringify(dbForUpload())})
    .then(function(res){if(!res.ok)return res.text().then(function(t){throw new Error('HTTP '+res.status+' '+(t?t.slice(0,160):''));});return res.json();})
    .then(function(){c.lastSyncAt=Date.now();save();setSyncStatus('synced');if(!silent)showToast('已上传到云端');return true;})
    .catch(function(e){var msg=jbErr(e);setSyncStatus('error',msg);if(!silent)showToast('上传失败：'+msg);return false;});
}

function syncDownload(silent){
  var c=syncConfig();
  if(!c.apiKey||!c.binId){if(!silent)showToast('请先配置 API Key 与 Bin ID');return Promise.resolve(false);}
  setSyncStatus('syncing');
  return fetch(JSONBIN_BASE+'/b/'+encodeURIComponent(c.binId),{headers:jbHeaders()})
    .then(function(res){if(!res.ok)return res.text().then(function(t){throw new Error('HTTP '+res.status+' '+(t?t.slice(0,160):''));});return res.json();})
    .then(function(data){
      var cloud=data&&data.record?data.record:null;
      if(!cloud||!cloud.tasks)throw new Error('云端数据为空或格式不符');
      mergeCloudData(cloud);
      c.lastSyncAt=Date.now();save();
      setSyncStatus('synced');
      if(!silent)showToast('已从云端拉取');
      return true;
    })
    .catch(function(e){var msg=jbErr(e);setSyncStatus('error',msg);if(!silent)showToast('拉取失败：'+msg);return false;});
}

/* 记录级合并：云端较新或本地无改动→直接覆盖；双方都改→按 id 取较新 */
function mergeCloudData(cloud){
  var localMod=DB.meta.lastModified||0;
  var cloudMod=(cloud.meta&&cloud.meta.lastModified)||0;
  var localClean=DB.meta.lastSyncAt&&localMod<=DB.meta.lastSyncAt;
  if(cloudMod>=localMod||localClean){
    DB.tasks=cloud.tasks||[];DB.ideas=cloud.ideas||[];DB.projects=cloud.projects||[];
    if(cloud.meta)DB.meta.backupPromptedCount=cloud.meta.backupPromptedCount||0;
    DB.meta.lastModified=cloudMod;DB.meta.lastSyncAt=Date.now();
    autoPostpone();
    return;
  }
  var recTs=function(r){return r.updatedAt||r.createdAt||0;};
  function mergeArr(la,ca){
    var m={};
    la.forEach(function(r){m[r.id]=r;});
    ca.forEach(function(r){if(!m[r.id]||recTs(r)>recTs(m[r.id]))m[r.id]=r;});
    return Object.keys(m).map(function(k){return m[k];});
  }
  DB.tasks=mergeArr(DB.tasks,cloud.tasks||[]);
  DB.ideas=mergeArr(DB.ideas,cloud.ideas||[]);
  DB.projects=mergeArr(DB.projects,cloud.projects||[]);
  DB.meta.lastModified=Date.now();DB.meta.lastSyncAt=Date.now();
  autoPostpone();
}

function createBin(){
  var c=syncConfig();
  setSyncStatus('syncing');
  DB.meta.lastModified=DB.meta.lastModified||Date.now();
  return fetch(JSONBIN_BASE+'/b',{method:'POST',headers:jbHeaders(),body:JSON.stringify(dbForUpload())})
    .then(function(res){if(!res.ok)return res.text().then(function(t){throw new Error('HTTP '+res.status+' '+(t?t.slice(0,160):''));});return res.json();})
    .then(function(data){
      var id=data&&data.metadata&&(data.metadata.id||data.metadata._id);
      if(!id)throw new Error('未能获取 Bin ID（响应格式异常）');
      c.binId=id;save();
      return id;
    });
}

function enableSync(){
  var c=syncConfig();
  if(!c.apiKey){showToast('请先填写 API Key');return Promise.resolve(false);}
  setSyncStatus('syncing');
  DB.meta.lastModified=DB.meta.lastModified||Date.now();
  var p=c.binId?Promise.resolve():createBin();
  return p.then(function(){
    return syncDownload(true);
  }).then(function(){
    c.autoSync=true;c.lastSyncAt=Date.now();save();
    setSyncStatus('synced');showToast('云同步已启用，多端数据将自动互通');return true;
  }).catch(function(e){setSyncStatus('error',e.message);showToast('启用失败：'+(e.message||'网络错误'));return false;});
}

function disableSync(){
  var c=syncConfig();c.autoSync=false;save();setSyncStatus('idle');
  showToast('已关闭自动同步（云端数据保留，可重新启用）');
}
function testSync(){
  var c=syncConfig();
  if(!c.apiKey){showToast('请先填写 API Key');return;}
  setSyncStatus('syncing');
  var url=c.binId?JSONBIN_BASE+'/b/'+encodeURIComponent(c.binId):JSONBIN_BASE+'/b';
  fetch(url,{headers:jbHeaders()}).then(function(res){
    if(!res.ok)return res.text().then(function(t){throw new Error('HTTP '+res.status+' '+(t?t.slice(0,160):''));});
    setSyncStatus('synced');showToast('连接成功 ✅ API Key 有效'+(c.binId?'，Bin 可访问':''));
  }).catch(function(e){var msg=jbErr(e);setSyncStatus('error',msg);showToast('连接失败：'+msg+(c.binId?'（检查 Bin ID）':'（检查 API Key）'));});
}
function removeSync(){
  var c=syncConfig();c.apiKey='';c.binId='';c.autoSync=false;c.lastSyncAt=0;save();
  setSyncStatus('idle');showToast('已断开云同步（云端 Bin 需登录 jsonbin.io 删除）');
}

function totalCount(){return DB.tasks.length+DB.ideas.length+DB.projects.length;}
function checkBackupTip(){
  const c=totalCount();
  const tip=$('#backupTip');
  if(c>=20&&DB.meta.backupPromptedCount<20){if(tip)tip.style.display='flex';}
  else if(c>=30&&DB.meta.backupPromptedCount<30){if(tip)tip.style.display='flex';}
  else {if(tip)tip.style.display='none';}
}
function exportData(){
  const data=JSON.stringify(DB,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`办公工作台备份_${todayStr()}.json`;a.click();
  URL.revokeObjectURL(a.href);
  DB.meta.backupPromptedCount=totalCount();save();
  checkBackupTip();showToast('已导出备份文件');
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data.tasks&&!data.ideas&&!data.projects)throw 0;
      confirmBox('导入将覆盖当前所有数据','建议先导出当前备份。导入后页面数据会被替换，确认继续？',()=>{
        DB={tasks:data.tasks||[],ideas:data.ideas||[],projects:data.projects||[],meta:data.meta||{backupPromptedCount:0}};
        if(!DB.meta)DB.meta={};DB.meta.backupPromptedCount=0;
        save();autoPostpone();renderAll();showToast('导入成功');
      });
    }catch(e){showToast('文件格式不对，请选导出的 JSON');}
  };
  reader.readAsText(file);
}

    syncCard='<div class="card card-pad sync-card" style="margin-bottom:12px">'+
      '<h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 16a4 4 0 010-8 5 5 0 019.6-1.5A4.5 4.5 0 1117 16H6z" stroke="#0d9488" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>云同步 · 多端数据互通 <span class="sync-status '+syncState+'">'+syncStateText()+'</span></h3>'+
      '<div class="sync-info">自动同步：<b>'+autoTxt+'</b>　|　Bin ID：<b style="font-size:11px;word-break:break-all">'+esc(c.binId)+'</b></div>'+
      '<div class="sync-info" style="color:var(--ink3)">改动后自动上传 · 打开页面自动拉取 · 离线照常使用</div>'+
      '<div class="form-row" style="gap:9px;margin-top:8px">'+
        '<button class="btn btn-primary" id="syncUp" style="flex:1;min-width:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>上传云端</button>'+
        '<button class="btn btn-ghost" id="syncDown" style="flex:1;min-width:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15V3m0 0L8 7m4-4l4 4M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>从云端拉取</button>'+
      '</div>'+
      '<div class="form-row" style="gap:9px;margin-top:9px">'+
        '<button class="btn btn-ghost" id="syncTest" style="flex:1;min-width:0">测试连接</button>'+
        '<button class="btn btn-ghost" id="syncToggle" style="flex:1;min-width:0">'+(c.autoSync?'关闭自动同步':'开启自动同步')+'</button>'+
        '<button class="btn btn-danger" id="syncRemove" style="flex:1;min-width:0">断开</button>'+
      '</div>'+
      '<div class="sync-info" style="margin-top:10px;color:var(--ink3)">断开后云端数据仍保留在 jsonbin，可重新启用连回；彻底删除请登录 jsonbin.io 删除该 Bin。</div>'+
    '</div>';
  }
  var html='<h2 class="sec"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>数据管理<span class="desc">云同步 · 备份 · 导入 · 清空</span></h2>'+
    '<div class="card card-pad" style="margin-bottom:12px"><div style="font-size:13px;color:var(--ink2);margin-bottom:11px">当前共 <b>'+totalCount()+'</b> 条数据（待办 '+DB.tasks.length+' · 灵感 '+DB.ideas.length+' · 项目 '+DB.projects.length+'）</div>'+
    '<div class="form-row" style="flex-direction:column;gap:9px">'+
      '<button class="btn btn-ghost" id="mExport" style="width:100%">导出备份 JSON</button>'+
      '<button class="btn btn-ghost" id="mImport" style="width:100%">导入恢复</button>'+
      '<button class="btn btn-ghost" id="mClearDemo" style="width:100%">清空示例数据</button>'+
      '<button class="btn btn-danger" id="mClearAll" style="width:100%">清空全部数据</button>'+
    '</div></div>'+
    syncCard+
    '<div class="card card-pad"><div style="font-size:12.5px;color:var(--ink3);line-height:1.7">导出 JSON 可作为本地快照备份；云同步是多端互通的首选方案；数据默认存本机浏览器，清除浏览器数据会丢失，请启用云同步或定期导出。</div></div>';
  $('#main').innerHTML=html;
  $('#mExport').onclick=exportData;
  $('#mImport').onclick=function(){$('#importInput').click();};
  $('#mClearDemo').onclick=clearDemo;
  $('#mClearAll').onclick=clearAll;
  var snew=$('#syncNew');if(snew)snew.onclick=function(){
    var c=syncConfig();c.apiKey=$('#syncKey').value.trim();c.binId=$('#syncBin').value.trim();
    if(!c.apiKey){showToast('请先填 API Key');return;}
    save();createBin().then(function(id){$('#syncBin').value=id;showToast('已新建 Bin：'+id);showDataSheet();}).catch(function(e){showToast('新建失败：'+(e.message||'网络错误'));});
  };
  var se=$('#syncEnable');if(se)se.onclick=function(){
    var c=syncConfig();c.apiKey=$('#syncKey').value.trim();c.binId=$('#syncBin').value.trim();
    if(!c.apiKey){showToast('请先填 API Key');return;}
    save();
    enableSync().then(function(ok){if(ok)showDataSheet();});
  };
  var stest=$('#syncTest');if(stest)stest.onclick=function(){
    var c=syncConfig();c.apiKey=$('#syncKey').value.trim();c.binId=$('#syncBin').value.trim();
    if(!c.apiKey){showToast('请先填 API Key');return;}
    save();testSync();
  };
  var su=$('#syncUp');if(su)su.onclick=function(){syncUpload(false);};
  var sd=$('#syncDown');if(sd)sd.onclick=function(){syncDownload(false).then(function(ok){if(ok)renderAll();});};
  var st=$('#syncToggle');if(st)st.onclick=function(){if(c.autoSync){disableSync();}else{c.autoSync=true;save();setSyncStatus('synced');showToast('已开启自动同步');}showDataSheet();};
  var sr=$('#syncRemove');if(sr)sr.onclick=function(){confirmBox('断开云同步？','本机将清除云端配置与凭证，不再自动同步。云端 Bin 仍保留在 jsonbin，可重新启用连回。',removeSync);};
}
function syncStateText(){return {idle:'未同步',syncing:'同步中',synced:'已同步',offline:'离线',error:'同步失败'}[syncState]||syncState;}

/* ---------- 模态 ---------- */
function confirmBox(title,text,cb,danger){
  $('#modalTitle').textContent=title;$('#modalText').innerHTML=text;
  $('#modalOk').onclick=()=>{closeModal();cb&&cb();};
  $('#modalOk').className='btn '+(danger?'btn-danger':'btn-primary');
  $('#modalMask').classList.add('show');
}
function closeModal(){$('#modalMask').classList.remove('show');}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------- 主渲染 ---------- */
function renderMain(){
  const backupHtml=`<div class="backup-tip" id="backupTip" style="display:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.3 3.9L2.4 17.5A2 2 0 004.1 20.5h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" stroke="#92400e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>数据已积累 ${totalCount()} 条，建议导出一份备份，避免清除浏览器时丢失<button id="tipExport">立即导出</button></div>`;
  if(curTab==='todo')renderTodo();
  else if(curTab==='idea')renderIdea();
  else if(curTab==='project')renderProject();
  else if(curTab==='review')renderReview();
  else if(curTab==='data')showDataSheet();
  // 注入备份提示到顶部
  const main=$('#main');
  const tip=document.createElement('div');
  tip.innerHTML=backupHtml;
  main.insertBefore(tip,main.firstChild);
  const te=$('#tipExport');if(te)te.onclick=exportData;
  checkBackupTip();
}
function renderAll(){renderHead();renderAlert();renderMain();renderSidebar();renderMobileNav();}

/* ---------- 事件绑定 ---------- */
$('#modalCancel').onclick=closeModal;
$('#modalMask').addEventListener('click',e=>{if(e.target.id==='modalMask')closeModal();});
$('#editSave').onclick=saveTaskEdit;
$('#editToggle').onclick=toggleFromEditor;
$('#editDel').onclick=delFromEditor;
$('#editMask').addEventListener('click',e=>{if(e.target.id==='editMask')closeEdit();});
$('#importInput').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value='';});

/* ---------- 全局错误兜底（兼容性问题时显示错误，避免空白） ---------- */
window.addEventListener('error',function(e){
  var msg='页面脚本报错：'+(e&&e.message?e.message:'未知错误')+(e&&e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':'');
  console.error(msg);
  var d=document.getElementById('errBanner');
  if(!d){d=document.createElement('div');d.id='errBanner';d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:10px 14px;font-size:13px;font-family:sans-serif;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.2)';document.body&&document.body.appendChild(d);}
  d.textContent=msg+' —— 请截图反馈，或换用 Chrome/Safari 最新版浏览器打开';
});

/* ---------- 启动 ---------- */
try{init();}catch(e){
  window.dispatchEvent(new ErrorEvent('error',{message:e.message,filename:location.href,lineno:0,colno:0,error:e}));
}
</script>
</body>
</html>
